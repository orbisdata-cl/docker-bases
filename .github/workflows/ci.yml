name: CI — Build and push base images

on:
  push:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  pull_request:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  schedule:
    # Every Monday at 06:00 UTC — rebuilds all images to pick up OS/runtime patches
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  ORG: orbisdata

jobs:
  detect-changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node-base:
              - 'node-base/**'
            node-nextjs:
              - 'node-nextjs/**'
            node-static:
              - 'node-static/**'
            python-base:
              - 'python-base/**'
            java-base:
              - 'java-base/**'

  # On scheduled runs, rebuild all images regardless of changes
  build-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image:
          - node-base
          - node-nextjs
          - node-static
          - python-base
          - java-base
        # On push/PR, filter to only changed images
        exclude: ${{
          (github.event_name == 'push' || github.event_name == 'pull_request') &&
          !contains(fromJSON(needs.detect-changes.outputs.images || '[]'), matrix.image) &&
          fromJSON('[{"image":"__placeholder__"}]') || fromJSON('[]')
          }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: ${{ env.ORG }}/${{ matrix.image }}:lts
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ORG }}/${{ matrix.image }}:lts
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          output: trivy-${{ matrix.image }}.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
          retention-days: 30

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.ORG }}/${{ matrix.image }}:lts
            ${{ env.ORG }}/${{ matrix.image }}:lts-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
