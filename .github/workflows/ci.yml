name: CI — Build and push base images

on:
  push:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  pull_request:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  schedule:
    # Every Monday at 06:00 UTC — rebuilds all images to pick up OS/runtime patches
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  detect-changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node-base:
              - 'node-base/**'
            node-nextjs:
              - 'node-nextjs/**'
            node-static:
              - 'node-static/**'
            python-base:
              - 'python-base/**'
            java-base:
              - 'java-base/**'
      - name: Determine images to build
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'images=["node-base","node-nextjs","node-static","python-base","java-base"]' >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            CHANGES='${{ steps.filter.outputs.changes }}'
            if [ "$CHANGES" = "[]" ] || [ -z "$CHANGES" ]; then
              echo 'images=["placeholder"]' >> "$GITHUB_OUTPUT"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "images=$CHANGES" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:lts
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:lts
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          output: trivy-${{ matrix.image }}.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
          retention-days: 30

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:lts
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:lts-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
