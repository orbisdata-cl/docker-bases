name: CI — Build and push base images

on:
  push:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  pull_request:
    branches: [main]
    paths:
      - 'node-base/**'
      - 'node-nextjs/**'
      - 'node-static/**'
      - 'python-base/**'
      - 'java-base/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  ORG: orbisdata

jobs:
  detect-changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node-base:
              - 'node-base/**'
            node-nextjs:
              - 'node-nextjs/**'
            node-static:
              - 'node-static/**'
            python-base:
              - 'python-base/**'
            java-base:
              - 'java-base/**'

  build-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          push: false
          tags: ${{ env.ORG }}/${{ matrix.image }}:lts
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.ORG }}/${{ matrix.image }}:lts
            ${{ env.ORG }}/${{ matrix.image }}:lts-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
